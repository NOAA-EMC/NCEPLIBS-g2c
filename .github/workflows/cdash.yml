name: cdash
on:
  push:
    branches:
    - develop

jobs:
  cdash:
    runs-on: ubuntu-latest

    env:
      FC: gfortran
      CC: gcc
      CDASH_TOKEN: ${{ secrets.CDASH_TOKEN }}

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpng-dev zlib1g-dev libjpeg-dev libopenjp2-7-dev libaec-dev

    - name: Build dependencies
      uses: NOAA-EMC/ci-build-nceplibs@oneinstalldir
      with:
        jasper-version: version-4.0.0

    - name: Run CDash submit
      uses: NOAA-EMC/ci-cdash@develop
